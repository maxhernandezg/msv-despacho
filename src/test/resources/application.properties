# Configuracion exclusiva para pruebas automatizadas (CI).
# Al estar en src/test/resources tiene prioridad sobre src/main/resources,
# por lo que los tests no necesitan una MySQL real ni variables de entorno.
spring.application.name=despacho
spring.datasource.url=jdbc:h2:mem:despachodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
